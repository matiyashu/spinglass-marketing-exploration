<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-label="Spin-Glass Marketing Exploration banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#121b30"/>
      <stop offset="100%" stop-color="#1a2543"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <circle cx="1280" cy="230" r="320" fill="url(#glow)"/>

  <!-- Spin lattice -->
  <g transform="translate(900,60)" opacity="0.9">
    <g stroke="#5eead4" stroke-opacity="0.18" stroke-width="1">
      <!-- horizontal links -->
      <line x1="0" y1="40" x2="600" y2="40"/>
      <line x1="0" y1="120" x2="600" y2="120"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="280" x2="600" y2="280"/>
      <!-- vertical links -->
      <line x1="50" y1="0" x2="50" y2="320"/>
      <line x1="150" y1="0" x2="150" y2="320"/>
      <line x1="250" y1="0" x2="250" y2="320"/>
      <line x1="350" y1="0" x2="350" y2="320"/>
      <line x1="450" y1="0" x2="450" y2="320"/>
      <line x1="550" y1="0" x2="550" y2="320"/>
    </g>

    <!-- highlighted frustrated bond (red) -->
    <line x1="150" y1="120" x2="250" y2="120" stroke="#f87171" stroke-width="2.5" opacity="0.85"/>
    <line x1="350" y1="200" x2="450" y2="200" stroke="#f87171" stroke-width="2.5" opacity="0.85"/>

    <!-- reinforcing bonds (teal) -->
    <line x1="50" y1="40" x2="150" y2="40" stroke="#5eead4" stroke-width="2.5" opacity="0.9"/>
    <line x1="250" y1="280" x2="350" y2="280" stroke="#5eead4" stroke-width="2.5" opacity="0.9"/>
    <line x1="450" y1="120" x2="550" y2="120" stroke="#5eead4" stroke-width="2.5" opacity="0.9"/>

    <!-- spins: up arrows -->
    <g fill="#5eead4">
      <g transform="translate(50,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(150,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(450,120)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(550,120)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(250,280)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(350,280)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(50,200)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(550,280)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
    </g>
    <!-- spins: down arrows -->
    <g fill="#f87171">
      <g transform="translate(250,120)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(150,120)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(350,200)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(450,200)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(50,280)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(150,200)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(450,280)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
      <g transform="translate(550,200)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
    </g>
    <g fill="#fcd34d">
      <g transform="translate(250,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(350,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(450,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(550,40)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(50,120)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(350,120)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(250,200)"><polygon points="0,-14 6,4 0,0 -6,4"/></g>
      <g transform="translate(150,280)"><polygon points="0,14 6,-4 0,0 -6,-4"/></g>
    </g>
  </g>

  <!-- Hamiltonian sketch -->
  <g transform="translate(80,80)" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="14" opacity="0.65">
    <text>E(s) = − ½ Σ Jᵢⱼ sᵢ sⱼ − Σ hᵢ(t) sᵢ</text>
    <text y="22">m_μ = (1/N) Σ ξᵢ sᵢ        // memory overlap</text>
    <text y="44">P(sᵢ=+1) = σ(2β [hᵢ + Σⱼ Jᵢⱼ sⱼ])</text>
  </g>

  <!-- Title -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="220" font-size="64" font-weight="800" fill="#f8fafc">Spin-Glass</text>
    <text x="80" y="288" font-size="64" font-weight="800" fill="url(#accent)">Marketing Exploration</text>
    <text x="82" y="332" font-size="22" font-weight="500" fill="#cbd5e1" opacity="0.92">
      Brand memory as an energy landscape · Ising · Hopfield · Glauber dynamics
    </text>
    <text x="82" y="370" font-size="16" font-weight="400" fill="#94a3b8" opacity="0.85">
      Couplings · external fields · memory attractors · hysteresis · parameter-chaos stability
    </text>

    <!-- pill badges -->
    <g transform="translate(80,400)">
      <g>
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#5eead4" stroke-opacity="0.5"/>
        <text x="59" y="18" font-size="12" fill="#5eead4" text-anchor="middle">Ising · Spin-Glass</text>
      </g>
      <g transform="translate(130,0)">
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.5"/>
        <text x="59" y="18" font-size="12" fill="#60a5fa" text-anchor="middle">Hopfield Memory</text>
      </g>
      <g transform="translate(260,0)">
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#fcd34d" stroke-opacity="0.5"/>
        <text x="59" y="18" font-size="12" fill="#fcd34d" text-anchor="middle">Glauber MCMC</text>
      </g>
      <g transform="translate(390,0)">
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#f87171" stroke-opacity="0.5"/>
        <text x="59" y="18" font-size="12" fill="#f87171" text-anchor="middle">Frustration · Hysteresis</text>
      </g>
    </g>
  </g>
</svg>
